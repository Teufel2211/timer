name: CI Tests

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  singleplayer-tests:
    name: Singleplayer Logic Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Make Gradle Wrapper Executable
        run: chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew test --no-daemon

      - name: Build Mod Jar
        run: ./gradlew build -x test --no-daemon

  multiplayer-smoke:
    name: Multiplayer Server Smoke Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Make Gradle Wrapper Executable
        run: chmod +x gradlew

      - name: Prepare Dedicated Server Files
        run: |
          printf "eula=true\n" > eula.txt
          printf "motd=TimerWave CI\nonline-mode=false\nenable-rcon=false\nmax-players=8\n" > server.properties

      - name: Run Server Smoke
        shell: bash
        run: |
          set +e
          timeout 120s ./gradlew runServer --no-daemon > server-smoke.log 2>&1
          code=$?
          set -e
          if [ "$code" -ne 0 ] && [ "$code" -ne 124 ]; then
            cat server-smoke.log
            exit "$code"
          fi
          grep -q "TimerWave initialized." server-smoke.log
          grep -q "Loading Minecraft 1.21.11" server-smoke.log

      - name: Upload Server Smoke Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: server-smoke-log
          path: server-smoke.log

  client-smoke:
    name: Singleplayer Client Smoke Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Make Gradle Wrapper Executable
        run: chmod +x gradlew

      - name: Run Client Smoke
        shell: bash
        run: |
          set +e
          timeout 180s xvfb-run -a ./gradlew runClient --no-daemon > client-smoke.log 2>&1
          code=$?
          set -e
          if [ "$code" -ne 0 ] && [ "$code" -ne 124 ]; then
            cat client-smoke.log
            exit "$code"
          fi
          grep -q "Loading Minecraft 1.21.11" client-smoke.log
          grep -q "TimerWave initialized." client-smoke.log

      - name: Upload Client Smoke Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: client-smoke-log
          path: client-smoke.log

  version-and-release-flow:
    name: Versioning And One-Click Release Flow
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Verify Version Bump Scheme
        shell: pwsh
        run: |
          Copy-Item -LiteralPath "gradle.properties" -Destination "gradle.properties.ci" -Force
          (Get-Content -LiteralPath "gradle.properties.ci" -Raw) -replace 'mod_version=\d+\.\d+\.\d+', 'mod_version=1.0.8' | Set-Content -LiteralPath "gradle.properties.ci" -Encoding utf8
          .\scripts\release\bump-version.ps1 -PropertiesPath "gradle.properties.ci"
          if (-not (Select-String -LiteralPath "gradle.properties.ci" -Pattern '^mod_version=1\.0\.9$' -Quiet)) { throw "Expected 1.0.9" }
          .\scripts\release\bump-version.ps1 -PropertiesPath "gradle.properties.ci"
          if (-not (Select-String -LiteralPath "gradle.properties.ci" -Pattern '^mod_version=1\.1\.0$' -Quiet)) { throw "Expected 1.1.0" }

          (Get-Content -LiteralPath "gradle.properties.ci" -Raw) -replace 'mod_version=\d+\.\d+\.\d+', 'mod_version=1.9.9' | Set-Content -LiteralPath "gradle.properties.ci" -Encoding utf8
          .\scripts\release\bump-version.ps1 -PropertiesPath "gradle.properties.ci"
          if (-not (Select-String -LiteralPath "gradle.properties.ci" -Pattern '^mod_version=2\.0\.0$' -Quiet)) { throw "Expected 2.0.0" }

          # Guard must reject invalid version patterns (like patch=10).
          (Get-Content -LiteralPath "gradle.properties.ci" -Raw) -replace 'mod_version=\d+\.\d+\.\d+', 'mod_version=1.0.10' | Set-Content -LiteralPath "gradle.properties.ci" -Encoding utf8
          $guardFailed = $false
          try {
            .\scripts\release\bump-version.ps1 -PropertiesPath "gradle.properties.ci"
          } catch {
            $guardFailed = $true
          }
          if (-not $guardFailed) { throw "Version guard did not reject invalid version 1.0.10" }
          Remove-Item -LiteralPath "gradle.properties.ci" -Force

      - name: Run One-Click Release Script
        shell: pwsh
        run: |
          powershell -ExecutionPolicy Bypass -File .\scripts\release\one-click-release.ps1

      - name: Validate Release Bundle Output
        shell: pwsh
        run: |
          $version = (Select-String -LiteralPath "gradle.properties" -Pattern '^mod_version=(.+)$').Matches[0].Groups[1].Value
          $jar = "build\release-bundle\timerwave-$version.jar"
          if (-not (Test-Path -LiteralPath $jar)) { throw "Missing release jar: $jar" }
          if (-not (Test-Path -LiteralPath "CHANGELOG.md")) { throw "CHANGELOG.md missing" }
