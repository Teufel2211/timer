name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Make Gradle Wrapper Executable
        run: chmod +x gradlew

      - name: Read Mod Version
        shell: bash
        run: |
          MOD_VERSION=$(grep '^mod_version=' gradle.properties | cut -d'=' -f2 | tr -d '\r')
          echo "MOD_VERSION=$MOD_VERSION" >> "$GITHUB_ENV"
          echo "Detected mod_version=$MOD_VERSION"

      - name: Use Versioned Changelog
        shell: bash
        run: |
          cp "release/changelogs/${MOD_VERSION}.md" CHANGELOG.md

      - name: Build Release Artifacts
        run: ./gradlew build prepareReleaseBundle -x test

      - name: Publish To Modrinth + CurseForge
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: ${{ vars.MODRINTH_PROJECT_ID }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          curseforge-id: ${{ vars.CURSEFORGE_PROJECT_ID }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          files: |
            build/libs/timerwave-${{ env.MOD_VERSION }}.jar
          name: TimerWave ${{ env.MOD_VERSION }}
          version: ${{ env.MOD_VERSION }}
          version-type: release
          changelog-file: CHANGELOG.md
          loaders: |
            fabric
          game-versions: |
            1.21.11
          dependencies: |
            fabric-api(required)
